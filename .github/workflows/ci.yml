name: Validar TrazoDesk Demo
on:
  push:
  pull_request:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts
        run: |
          node --check src/domain.mjs
          node --check src/store.mjs
          node --check src/app.mjs
      - name: Ejecutar tests
        run: npm test
