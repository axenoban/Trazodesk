name: Publicar TrazoDesk Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check src/domain.mjs
          node --check src/store.mjs
          node --check src/app.mjs
      - name: Ejecutar pruebas
        run: npm test
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R assets src dist/
          test -f dist/index.html
          test -f dist/src/app.mjs
      - name: Empaquetar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
